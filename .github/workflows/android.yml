name: Build Android TV APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Tests, lint and APK
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and manifest
        run: |
          SDK_TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SDK_TOOLS" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          APK_ANALYZER=$(find "$ANDROID_HOME" -name apkanalyzer | head -1)
          "$APK_ANALYZER" manifest print app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/manifest.xml
          grep -q LEANBACK_LAUNCHER app/build/outputs/apk/debug/manifest.xml
          grep -q FOREGROUND_SERVICE_SPECIAL_USE app/build/outputs/apk/debug/manifest.xml
          cd app/build/outputs/apk/debug
          mv app-debug.apk OctoEQ-TV-0.3.0.apk
          sha256sum OctoEQ-TV-0.3.0.apk > SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctoEQ-TV-0.3.0
          path: |
            app/build/outputs/apk/debug/OctoEQ-TV-0.3.0.apk
            app/build/outputs/apk/debug/SHA256SUMS
          retention-days: 3
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          retention-days: 3
          path: app/build/reports/
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OctoEQ-TV-0.3.0
          path: apk
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="preview-0.3.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" apk/* --target "$GITHUB_SHA" --prerelease --title "OctoEQ TV 0.3.0 • build ${GITHUB_RUN_NUMBER}" --notes "APK de test signé debug. Navigation OK régler/valider, profils interpolés et service audio persistant. Effets globaux expérimentaux : validation sur TV réelle requise. Signature debug CI non stable entre runners : une désinstallation peut être nécessaire pour remplacer un ancien APK."

